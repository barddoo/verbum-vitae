<!doctype html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline - Verbum Vitae</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center; background: #0f1117; color: #e2e4e9; font-family: system-ui, sans-serif; }
    .card { text-align: center; padding: 2rem; }
    h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
    p { color: #7e8392; margin: 0 0 1.5rem; }
    .btn { display: inline-block; padding: 0.5rem 1.25rem; border-radius: 6px; background: #1a1d2b; color: #e2e4e9; text-decoration: none; border: 1px solid #2a2d3d; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sem conexão</h1>
    <p>Você está offline. Versículos já abertos continuam disponíveis.</p>
    <a href="/" class="btn">Tentar novamente</a>
  </div>
</body>
</html>
