<!doctype html>

  <meta name="theme-color" content="#1c1b1a" />
  <title>Offline - Verbum Vitae</title>

    .btn { display: inline-block; padding: 0.75rem 1.5rem; border-radius: 9999px; background: #1a9b8c; color: #fff; text-decoration: none; font-weight: 700; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sem conexão</h1>
