name = "verbum-vitae"
main = "src/index.ts"
compatibility_date = "2026-05-14"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "verbum-vitae"
database_id = "2d0926ac-edbd-429b-94f0-523552514bce"
migrations_dir = "db/migrations"

[placement]
mode = "smart"

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true

[version_metadata]
binding = "CF_VERSION_METADATA"

[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "SYNC_RATE_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 60
  period = 60

[[ratelimits]]
name = "VERSES_RATE_LIMITER"
namespace_id = "1003"

  [ratelimits.simple]
  limit = 120
  period = 60

[assets]
directory = "../app/dist"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "PRESENCE"
class_name = "PresenceDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PresenceDO"]

[env.production]
name = "verbum-vitae-api"
